<style>
    #dark {
        grid-row: 2;
        grid-column: 2;
        display: grid;
        grid-template-rows: 1fr 1fr;
        grid-template-columns: 1fr 1fr 1fr 1fr 1fr;
    }

    #feast {
        grid-row: 4;
        grid-column: 2;
        display: grid;
        grid-template-rows: 1fr 1fr;
        grid-template-columns: 1fr 1fr 1fr 1fr 1fr;
    }

    #christmas {
        grid-row: 6;
        grid-column: 2;
        display: grid;
        grid-template-rows: 1fr 1fr;
        grid-template-columns: 1fr 1fr 1fr 1fr 1fr;
    }

    #dark, #feast, #christmas {
        border-radius: 10px;
        border: 1px solid #FFB8DE;
        overflow: hidden
    }

    #darkimg, #feastimg, #christmasimg {
        width: 100%;
        height: 250px;
        object-fit: cover;
    }

    #darktext {
        grid-row: 1;
        grid-column: 2;
        place-self: center;
    }
    
    #feastext {
        grid-row: 3;
        grid-column: 2;
        place-self: center;
    }

    #christmastext {
        grid-row: 5;
        grid-column: 2;
        place-self: center;
    }
</style>
